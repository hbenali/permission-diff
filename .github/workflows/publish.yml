name: Publish

# Runs only on a version tag (X.Y.Z). The tag must match manifest.json "version".
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tag matches manifest version
        run: |
          v=$(node -p "require('./manifest.json').version")
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != manifest $v"; exit 1; }
      - name: Unit tests
        run: node --test test/diff.test.mjs
      - name: Lint (web-ext)
        run: npx --yes web-ext@10.8.0 lint --source-dir . --ignore-files 'test/**' '.github/**' '*.md' --warnings-as-errors=false
      - name: Package
        run: |
          mkdir dist
          zip -r "dist/permission-diff-${GITHUB_REF_NAME}.zip" manifest.json background.js diff.js hook.js relay.js popup.html popup.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zip
          path: dist/*.zip
          if-no-files-found: error

  # Draft only: publish it by hand with notes (releases are immutable once published).
  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zip
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --draft --title "$GITHUB_REF_NAME" --verify-tag

  chrome-web-store:
    needs: build
    runs-on: ubuntu-latest
    environment: chrome-web-store # add required reviewers here to gate publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zip
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Upload and publish (Chrome, Brave and other Chromium browsers)
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx --yes chrome-webstore-upload-cli@4.0.2 upload --source dist/permission-diff-${GITHUB_REF_NAME}.zip --auto-publish

  firefox-amo:
    needs: build
    runs-on: ubuntu-latest
    environment: firefox-amo
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zip
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Submit to addons.mozilla.org (listed channel)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          mkdir src && unzip -q dist/*.zip -d src
          npx --yes web-ext@10.8.0 sign --source-dir src --channel listed \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --approval-timeout 0
